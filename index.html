<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=person,key">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/mediaqueries.css">
    <title>Franca Dev</title>
</head>

<body>
    <main>
        <div class="container">
            <div id="imagem">
                <img src="imagens/fundo.jpeg" alt="Imagem de Fundo">

            </div>
            <div id="login">
                <h1>Welcome Back!</h1>
                <p>Enter your info to Sign In</p>
                <form action="" method="post" autocomplete="on">
                    <label for="idemail"><span id="email" class="material-symbols-outlined">
                            person </span>
                    </label>
                    <input type="email" name="email" id="idemail" placeholder="Email" required>
                    <br>
                    <label for="idsenha">
                        <span id="senha" class="material-symbols-outlined">
                            key
                        </span>
                    </label>
                    <input type="password" name="senha" id="idsenha" placeholder="Senha" required minlength="8">
                    <br>
                    <input id="entrar" type="submit" value="Sign In">


                </form>
            </div>
        </div>
    </main>

</body>

</html>
